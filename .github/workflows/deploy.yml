name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-${{ github.ref }}

permissions:
  id-token: write   # OIDC federation to Azure (ADR 0014), no stored secrets
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, public-api, worker, db]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/event-manager/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  staging:
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: staging, image-tag: "${{ github.sha }}" }

  prod:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: prod, image-tag: "${{ github.sha }}" }
