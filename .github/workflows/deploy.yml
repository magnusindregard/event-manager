name: Deploy
# Manual only until staging exists (planned for the end of milestone 2, see
# docs/implementation-plan.md). Run without inputs → build images → deploy staging.
# To deploy staging on every merge, add back:  push: { branches: [main] }
# Prod: run with "promote to prod" and the image tag (git SHA) staging already runs.
# Images are copied from the staging registry, so prod runs exactly what staging tested.
on:
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Promote an image tag that staging already runs to prod
        type: boolean
        default: false
      image_tag:
        description: Git SHA to promote (required when promoting)
        type: string
        default: ""

concurrency: deploy-${{ github.ref }}

permissions:
  id-token: write   # OIDC federation to Azure (ADR 0014), no stored secrets
  contents: read

jobs:
  images:
    if: ${{ !inputs.promote_to_prod }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, public-api, worker, db]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/event-manager/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  staging:
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: staging, image-tag: "${{ github.sha }}" }

  promote-images:
    if: ${{ inputs.promote_to_prod }}
    runs-on: ubuntu-latest
    # Protection rules on "prod" (required reviewers) gate the whole promotion.
    environment: prod
    steps:
      - name: Require an image tag
        if: ${{ inputs.image_tag == '' }}
        run: echo "::error::image_tag is required when promoting" && exit 1
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The prod deploy identity needs AcrPull on the staging registry.
      - name: Copy images from staging registry
        run: |
          for app in api public-api worker db; do
            az acr import --name "${{ vars.ACR_NAME }}" --force \
              --source "${{ vars.STAGING_ACR_NAME }}.azurecr.io/event-manager/$app:${{ inputs.image_tag }}" \
              --image "event-manager/$app:${{ inputs.image_tag }}"
          done

  prod:
    needs: promote-images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: prod, image-tag: "${{ inputs.image_tag }}" }
