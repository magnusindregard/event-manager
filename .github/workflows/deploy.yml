name: Deploy
# Staging (the online test environment): CI calls this after its checks pass for a push to main,
# so only a commit that passed CI deploys automatically, and the images, checkout and CI result
# share one SHA. Run by hand to deploy a branch (a preview on staging) or redeploy main.
# Deploys to an environment run one at a time and never silently roll it back: replacing a newer
# main commit, or another branch's preview, is refused unless "replace newer" is ticked. Main
# replaces a branch preview (scripts/deploy-env.sh).
# Prod: run with "promote to prod" and the image tag (git SHA) staging already runs.
# Images are copied from the staging registry, so prod runs exactly what staging tested.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: Promote an image tag that staging already runs to prod
        type: boolean
        default: false
      image_tag:
        description: Git SHA to promote (required when promoting)
        type: string
        default: ""
      replace_newer:
        description: Deploy even if it replaces a newer main commit or another branch's preview
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC federation to Azure (ADR 0014), no stored secrets
  contents: read

jobs:
  images:
    if: ${{ !inputs.promote_to_prod }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: [api, public-api, attendee, worker, db]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/event-manager/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  staging:
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: staging, image-tag: "${{ github.sha }}", replace-newer: "${{ inputs.replace_newer == true }}" }

  promote-images:
    if: ${{ inputs.promote_to_prod }}
    runs-on: ubuntu-latest
    # Protection rules on "prod" (required reviewers) gate the whole promotion.
    environment: prod
    steps:
      - name: Require an image tag
        if: ${{ inputs.image_tag == '' }}
        run: echo "::error::image_tag is required when promoting" && exit 1
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The prod deploy identity needs AcrPull on the staging registry.
      - name: Copy images from staging registry
        run: |
          for app in api public-api attendee worker db; do
            az acr import --name "${{ vars.ACR_NAME }}" --force \
              --source "${{ vars.STAGING_ACR_NAME }}.azurecr.io/event-manager/$app:${{ inputs.image_tag }}" \
              --image "event-manager/$app:${{ inputs.image_tag }}"
          done

  prod:
    needs: promote-images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: prod, image-tag: "${{ inputs.image_tag }}", replace-newer: "${{ inputs.replace_newer == true }}" }
