name: Deploy environment
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      image-tag: { type: string, required: true }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Protection rules on the "prod" environment give the manual approval step.
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      PG_ADMIN_GROUP_ID: ${{ vars.PG_ADMIN_GROUP_ID }}
      PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      DEPLOY_FRONT_DOOR: ${{ vars.DEPLOY_FRONT_DOOR || 'true' }}
      GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
      GRAPH_TENANT_DOMAIN: ${{ vars.GRAPH_TENANT_DOMAIN }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      PG_ADMIN_TYPE: ${{ vars.PG_ADMIN_TYPE || 'Group' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Bicep → migrations → admin upload → smoke test. The same script deploys by hand (infra/README.md).
      - name: Deploy
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENTRA_ADMIN_CLIENT_ID: ${{ vars.ENTRA_ADMIN_CLIENT_ID }}
          ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
        run: scripts/deploy-env.sh ${{ inputs.environment }} ${{ inputs.image-tag }}
