name: Deploy environment
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      image-tag: { type: string, required: true }
      # Deploy even if it replaces a newer main commit or another branch's preview (ALLOW_REPLACE).
      replace-newer: { type: string, default: "false" }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Protection rules on the "prod" environment give the manual approval step.
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time, whichever branch or trigger started it. A newer
    # pending deploy replaces an older pending one; a running deploy is never cancelled.
    concurrency:
      group: deploy-env-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RG: ${{ vars.RESOURCE_GROUP }}
      PG_ADMIN_GROUP_ID: ${{ vars.PG_ADMIN_GROUP_ID }}
      PG_ADMIN_GROUP_NAME: ${{ vars.PG_ADMIN_GROUP_NAME }}
      OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      DEPLOY_FRONT_DOOR: ${{ vars.DEPLOY_FRONT_DOOR || 'true' }}
      GRAPH_TENANT_ID: ${{ vars.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ vars.GRAPH_CLIENT_ID }}
      GRAPH_TENANT_DOMAIN: ${{ vars.GRAPH_TENANT_DOMAIN }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      POSTMARK_WEBHOOK: ${{ vars.POSTMARK_WEBHOOK || 'false' }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      PG_ADMIN_TYPE: ${{ vars.PG_ADMIN_TYPE || 'Group' }}
    steps:
      # Full history: deploy-env.sh compares image-tag with the commit the environment runs and with main.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Freshness check → Bicep (infra, migrate job) → migrations → Bicep (apps) → admin upload → smoke test. The same script deploys by hand (infra/README.md).
      - name: Deploy
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          ENTRA_ADMIN_CLIENT_ID: ${{ vars.ENTRA_ADMIN_CLIENT_ID }}
          ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          ALLOW_REPLACE: ${{ inputs.replace-newer }}
        run: scripts/deploy-env.sh ${{ inputs.environment }} ${{ inputs.image-tag }}
